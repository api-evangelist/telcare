name: Telcare
description: 'Telcare was a digital-health company that built the first cellular-enabled
  blood glucose monitoring (BGM) system: a meter with an embedded cellular module that
  pushed readings to Telcare''s Telserve/Telcloud back end, connected to EMR systems,
  and paired with companion smartphone apps for people managing diabetes and their
  caregivers. The brand was acquired into BioTelemetry and is now part of Philips
  (BioTel Care); the telcare.com domain redirects to Philips ambulatory monitoring,
  and device-data integration is offered through the third-party Validic health-data
  platform rather than a first-party public API. Surfaced as a Norwest Venture Partners
  portfolio lead; enrichment found no first-party developer portal, OpenAPI, or public
  API surface for the Telcare brand.'
